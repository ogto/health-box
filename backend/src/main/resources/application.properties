spring.application.name=health-box-api
server.port=${HEALTH_BOX_API_PORT:8081}
server.address=${HEALTH_BOX_API_ADDRESS:127.0.0.1}
server.servlet.context-path=/api/v5
server.forward-headers-strategy=framework
health-box.internal-api-key=${HEALTH_BOX_INTERNAL_API_KEY:}

# This service has no fallback to a NoTitle/Monoty datasource. All three values are required.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${HEALTH_BOX_DB_URL}
spring.datasource.username=${HEALTH_BOX_DB_USERNAME}
spring.datasource.password=${HEALTH_BOX_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${HEALTH_BOX_DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Health-box-only Toss keys. Never reuse the NoTitle or bread-storage property names.
health-box.toss.live-secret-key=${HEALTH_BOX_TOSS_LIVE_SECRET_KEY:}
health-box.toss.test-secret-key=${HEALTH_BOX_TOSS_TEST_SECRET_KEY:}
health-box.toss.credential-source=${HEALTH_BOX_TOSS_CREDENTIAL_SOURCE:health-box}
health-box.toss.temporary-bridge-expires-at=${HEALTH_BOX_TOSS_TEMPORARY_BRIDGE_EXPIRES_AT:}

# Dedicated HealthBox asset storage. Mount this path on persistent storage in production.
health-box.upload.directory=${HEALTH_BOX_UPLOAD_DIRECTORY:./data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
